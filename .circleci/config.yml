
version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      # Build Docker image
      - setup_remote_docker

      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/animation-app:latest .

      # Login to Docker Hub
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

      # Push Docker image
      - run:
          name: Push Docker Image
          command: |
            docker push $DOCKERHUB_USERNAME/animation-app:latest

workflows:
  docker-pipeline:
    jobs:
      - build-and-push
